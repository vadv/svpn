name: svpn-test

services:
  keys:
    image: svpn-test:local
    build:
      context: .
      dockerfile: e2e/Dockerfile
    command: [python3, /e2e/keys.py]
    volumes:
      - keys:/keys
    network_mode: none

  server:
    image: svpn-test:local
    init: true
    command: [python3, -u, /e2e/server.py]
    cap_add: [NET_ADMIN]
    sysctls:
      net.ipv4.ip_forward: 1
    devices: [/dev/net/tun:/dev/net/tun]
    environment:
      SVPN_TEST_DEFAULT_GW: 172.30.77.1
    volumes:
      - keys:/keys:ro
    networks:
      test:
        ipv4_address: 172.30.77.2
      zdirect:
        ipv4_address: 172.31.77.2
      zby:
        ipv4_address: 172.32.77.2
    depends_on:
      keys:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python3, -c, "import socket; socket.create_connection(('127.0.0.1', 22), 1).close()"]
      interval: 1s
      timeout: 2s
      retries: 15

  server2:
    image: svpn-test:local
    init: true
    command: [python3, -u, /e2e/server.py]
    cap_add: [NET_ADMIN]
    sysctls:
      net.ipv4.ip_forward: 1
    devices: [/dev/net/tun:/dev/net/tun]
    environment:
      SVPN_TEST_DEFAULT_GW: 172.30.77.1
    volumes:
      - keys:/keys:ro
    networks:
      test:
        ipv4_address: 172.30.77.5
    depends_on:
      keys:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python3, -c, "import socket; socket.create_connection(('127.0.0.1', 22), 1).close()"]
      interval: 1s
      timeout: 2s
      retries: 15

  target_by:
    image: svpn-test:local
    init: true
    command: [python3, -u, /e2e/target.py]
    networks:
      test:
        ipv4_address: 172.30.77.6
      zby:
        ipv4_address: 172.32.77.5

  dns:
    image: svpn-test:local
    init: true
    command: [python3, -u, /e2e/dnsserver.py]
    volumes:
      - dnsconf:/dns
    networks:
      test:
        ipv4_address: 172.30.77.7

  files:
    image: svpn-test:local
    init: true
    command: [python3, -u, /e2e/fileserver.py]
    volumes:
      - jobfiles:/files
    networks:
      test:
        ipv4_address: 172.30.77.8

  client:
    image: svpn-test:local
    init: true
    command: [python3, -u, /e2e/integration.py]
    cap_add: [NET_ADMIN, NET_RAW]
    sysctls:
      net.ipv4.ip_forward: 1
    devices: [/dev/net/tun:/dev/net/tun]
    environment:
      SVPN_TEST_LOG_DIR: /testlogs
      SVPN_TEST_GROUP: ${SVPN_TEST_GROUP:-all}
    volumes:
      - keys:/keys:ro
      - dnsconf:/dns
      - jobfiles:/files
      - ${SVPN_TEST_ARTIFACTS:-./e2e/.work/artifacts/manual}/sessions:/testlogs
    networks:
      test:
        ipv4_address: 172.30.77.3
    depends_on:
      server:
        condition: service_healthy
      dns:
        condition: service_started

  target:
    image: svpn-test:local
    init: true
    command: [python3, -u, /e2e/target.py]
    networks:
      test:
        ipv4_address: 172.30.77.4
      zdirect:
        ipv4_address: 172.31.77.4

volumes:
  keys:
  dnsconf:
  jobfiles:

networks:
  test:
    internal: true
    ipam:
      config:
        - subnet: 172.30.77.0/24
  zdirect:
    internal: true
    ipam:
      config:
        - subnet: 172.31.77.0/24
  zby:
    internal: true
    ipam:
      config:
        - subnet: 172.32.77.0/24
