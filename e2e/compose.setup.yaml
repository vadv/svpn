name: svpn-setup-test

services:
  keys:
    image: svpn-test:local
    build:
      context: ..
      dockerfile: e2e/Dockerfile
    command: [python3, /e2e/keys.py]
    volumes:
      - keys:/keys
    network_mode: none

  server:
    platform: linux/amd64
    image: svpn-setup-server:local
    build:
      context: ..
      dockerfile: e2e/Dockerfile.setup-server
    init: true
    cap_add:
      - NET_ADMIN
    volumes:
      - keys:/keys:ro
    networks:
      provision:
        ipv4_address: 172.30.88.2
    depends_on:
      keys:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python3, -c, "import socket; socket.create_connection(('127.0.0.1', 22), 1).close()"]
      interval: 1s
      timeout: 2s
      retries: 15

  client:
    image: svpn-test:local
    init: true
    command: [python3, -u, /e2e/suite_setup.py]
    environment:
      SVPN_TEST_LOG_DIR: /testlogs
    volumes:
      - keys:/keys:ro
      - ${SVPN_TEST_ARTIFACTS:-./e2e/.work/artifacts/manual}/sessions:/testlogs
    networks:
      provision:
        ipv4_address: 172.30.88.3
    depends_on:
      server:
        condition: service_healthy

volumes:
  keys:

networks:
  provision:
    ipam:
      config:
        - subnet: 172.30.88.0/24
