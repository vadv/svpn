[package]
name = "svpn"
version = "0.9.0"
edition = "2024"
rust-version = "1.89"
description = "IPv4 TUN VPN with SSH control"
publish = false
license = "MIT"

[dependencies]
aes-gcm = { version = "0.10", features = ["aes", "zeroize"] }
anyhow = "1"
bytes = "1.12.1"
clap = { version = "4", features = ["derive"] }
getrandom = "0.3"
h3 = "0.0.8"
h3-quinn = "0.0.10"
http = "1.5.0"
nix = { version = "0.31.3", default-features = false, features = ["fs", "signal"] }
quinn = { version = "0.11.12", default-features = false, features = ["rustls-ring", "runtime-tokio", "futures-io", "log"] }
rlimit = "0.10"
route_manager = "0.2.16"
russh = { version = "0.64.1", default-features = false, features = ["ring", "flate2", "rsa"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.9", default-features = false, features = ["parse", "serde", "std"] }
sha2 = "0.11.1"
socket2 = "0.6"
str0m = { version = "0.24.1", default-features = false, features = ["rust-crypto"] }
tokio = { version = "1.49", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "process", "signal", "sync", "time"] }
mimalloc = "0.1"
tun-rs = { version = "=2.8.11", features = ["async_tokio"] }
zeroize = "1"

rcgen = "0.14.10"

[patch.crates-io]
# shortcut: PR57 ещё не в релизе; убрать fork после upstream-релиза с этим исправлением.
sctp-proto = { git = "https://github.com/vadv/sctp-proto", rev = "3266f9709a842f7fbde632a952bd086f3bcbb067" }

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
# Патч crates-io переписывает на fork; версия здесь только для резолва.
sctp-proto = "0.10.6"
tokio = { version = "1.49", features = ["test-util"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
quinn = { version = "0.11.12", default-features = false, features = ["rustls-ring", "runtime-tokio", "futures-io", "log"] }
russh = { version = "0.64.1", default-features = false, features = ["ring", "flate2", "rsa"] }
serde_json = "1"
toml = { version = "0.9", default-features = false, features = ["parse", "serde", "std"] }
